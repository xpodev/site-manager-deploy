name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: shellcheck deploy.sh

      - name: Start mock deploy service
        run: |
          python3 .github/mock_server.py 8080 &
          for _ in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8080 && break; sleep 0.25; done

      - name: Build a test site
        run: |
          mkdir -p out/css
          echo '<h1>hello</h1>' > out/index.html
          echo 'h1 {}' > out/css/site.css

      - name: Deploy with a site key
        id: site
        uses: ./
        with:
          url: http://127.0.0.1:8080/
          token: site-token
          path: out

      - name: Deploy with a namespace key
        id: ns
        uses: ./
        with:
          url: http://127.0.0.1:8080
          token: ns-token
          path: out
          site: docs

      - name: Check outputs
        run: |
          test "${{ steps.site.outputs.namespace }}/${{ steps.site.outputs.site }}" = test/site
          test "${{ steps.site.outputs.files }}" = 2
          test "${{ steps.site.outputs.bytes }}" = 21
          test "${{ steps.ns.outputs.namespace }}/${{ steps.ns.outputs.site }}" = test/docs

      - name: Deploy with a revoked key
        id: revoked
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8080
          token: old-token
          path: out

      - name: Namespace key without a site
        id: no-site
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8080
          token: ns-token
          path: out

      - name: Site key for another site
        id: other-site
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8080
          token: site-token
          path: out
          site: docs

      - name: Deploy a missing folder
        id: missing
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8080
          token: site-token
          path: does-not-exist

      - name: Check failures
        run: |
          test "${{ steps.revoked.outcome }}" = failure
          test "${{ steps.no-site.outcome }}" = failure
          test "${{ steps.other-site.outcome }}" = failure
          test "${{ steps.missing.outcome }}" = failure
